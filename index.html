
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERO.OS - 智能指挥中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cyber: {
                bg: 'var(--bg-main)', 
                panel: 'var(--bg-panel)', 
                border: 'var(--border-color)', 
                text: 'var(--text-main)', 
                dim: 'var(--text-dim)',
                
                // Dynamic Accents
                blue: 'var(--accent-primary)', 
                cyan: 'var(--accent-secondary)',
                purple: 'var(--accent-tertiary)',
                
                // Functional Colors
                green: 'var(--color-green)',
                orange: 'var(--color-orange)',
                pink: 'var(--color-pink)',
                red: 'var(--color-red)',
                yellow: 'var(--color-yellow)',
              }
            },
            fontFamily: {
              sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            boxShadow: {
              'glass': 'var(--shadow-glass)',
              'glow-blue': '0 0 30px var(--glow-primary)',
              'glow-cyan': '0 0 30px var(--glow-secondary)',
              'neon': '0 0 10px var(--accent-primary), 0 0 20px var(--accent-primary)',
            },
            animation: {
              'float': 'float 10s ease-in-out infinite',
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'mesh': 'mesh 20s infinite ease-in-out',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0) scale(1)' },
                '50%': { transform: 'translateY(-20px) scale(1.05)' },
              },
              mesh: {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* --- Dark Mode Defaults (Cosmos) --- */
        --bg-main: #050505;
        --bg-panel: rgba(20, 20, 25, 0.6);
        --border-color: rgba(255, 255, 255, 0.08);
        --text-main: #F5F5F7;
        --text-dim: #86868B;
        
        --accent-primary: #0A84FF;
        --accent-secondary: #40C8E0;
        --accent-tertiary: #5E5CE6;
        
        --color-green: #30D158;
        --color-orange: #FF9F0A;
        --color-pink: #FF375F;
        --color-red: #FF453A;
        --color-yellow: #FFD60A;

        --glow-primary: rgba(10, 132, 255, 0.4);
        --glow-secondary: rgba(64, 200, 224, 0.3);
        --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        
        /* High Quality Gradient - Smoother transitions */
        --gradient-mesh: radial-gradient(circle at 15% 15%, rgba(10, 132, 255, 0.08) 0%, transparent 40%),
                         radial-gradient(circle at 85% 85%, rgba(94, 92, 230, 0.08) 0%, transparent 40%);
      }

      /* --- POLARIS THEME (Enterprise Light Mode) --- */
      [data-theme='polaris'] {
        --bg-main: #F8FAFC; 
        --bg-panel: rgba(255, 255, 255, 0.8);
        --border-color: #E2E8F0;
        --text-main: #0F172A; 
        --text-dim: #64748B;
        
        --accent-primary: #2563EB;
        --accent-secondary: #0891B2;
        --accent-tertiary: #7C3AED;
        
        --color-green: #059669;
        --color-orange: #D97706;
        --color-pink: #DB2777;
        --color-red: #DC2626;
        --color-yellow: #CA8A04;

        --glow-primary: rgba(37, 99, 235, 0.1); 
        --glow-secondary: rgba(8, 145, 178, 0.1);
        
        --shadow-glass: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        
        --gradient-mesh: radial-gradient(circle at 50% 0%, #F1F5F9 0%, transparent 70%);
      }

      body {
        background-color: var(--bg-main);
        background-image: var(--gradient-mesh);
        background-attachment: fixed;
        background-size: 100% 100%;
        color: var(--text-main);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
        transition: background-color 0.5s ease;
        position: relative;
      }

      /* NOISE TEXTURE OVERLAY */
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
        /* Subtle noise texture to prevent color banding */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        opacity: 0.5;
        mix-blend-mode: overlay;
      }

      /* --- COMPONENT STYLES --- */

      .apple-glass {
        background: var(--bg-panel);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-glass);
        border-radius: 24px;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }
      
      [data-theme='polaris'] .apple-glass {
        background: rgba(255, 255, 255, 0.7) !important;
        backdrop-filter: blur(20px) !important;
        border: 1px solid #E2E8F0 !important;
      }

      [data-theme='polaris'] .apple-glass:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.05) !important;
        border-color: #CBD5E1 !important;
      }

      /* Inputs */
      .input-holo {
        background: rgba(0, 0, 0, 0.2) !important;
        border: 1px solid var(--border-color) !important;
        border-radius: 12px !important;
        color: var(--text-main) !important;
        transition: all 0.2s ease;
        font-family: 'JetBrains Mono', monospace;
      }

      [data-theme='polaris'] .input-holo {
        background: #FFFFFF !important;
        border: 1px solid #CBD5E1 !important;
        color: #1E293B !important;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
      }

      .input-holo:focus {
        border-color: var(--accent-primary) !important;
        outline: none;
        box-shadow: 0 0 0 2px var(--glow-primary);
      }
      
      [data-theme='polaris'] .input-holo:focus {
        border-color: var(--accent-primary) !important;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1) !important;
      }

      /* Text Glows - Refined */
      .text-glow { text-shadow: 0 0 20px var(--glow-primary); }
      .text-glow-blue { text-shadow: 0 0 20px rgba(10, 132, 255, 0.5); }
      .text-glow-green { text-shadow: 0 0 20px rgba(48, 209, 88, 0.5); }
      .text-glow-red { text-shadow: 0 0 20px rgba(255, 69, 58, 0.5); }
      
      [data-theme='polaris'] .text-glow,
      [data-theme='polaris'] .text-glow-blue,
      [data-theme='polaris'] .text-glow-green, 
      [data-theme='polaris'] .text-glow-red {
          text-shadow: none !important;
      }

      /* Scrollbars */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
      
      [data-theme='polaris'] ::-webkit-scrollbar-thumb { background: #CBD5E1; }
      [data-theme='polaris'] ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

      /* --- DEEP OVERRIDES FOR LIGHT MODE (POLARIS) --- */
      
      [data-theme='polaris'] .bg-black,
      [data-theme='polaris'] .bg-black\/20,
      [data-theme='polaris'] .bg-black\/30,
      [data-theme='polaris'] .bg-black\/40,
      [data-theme='polaris'] .bg-black\/50,
      [data-theme='polaris'] .bg-black\/60,
      [data-theme='polaris'] .bg-black\/80,
      [data-theme='polaris'] .bg-black\/90,
      [data-theme='polaris'] .bg-\[\#0c0c0c\],
      [data-theme='polaris'] .bg-\[\#0A0A0A\],
      [data-theme='polaris'] .bg-\[\#0F0F0F\],
      [data-theme='polaris'] .bg-\[\#121212\],
      [data-theme='polaris'] .bg-\[\#151515\],
      [data-theme='polaris'] .bg-\[\#18181a\],
      [data-theme='polaris'] .bg-\[\#1c1c1e\] {
          background-color: #FFFFFF !important;
          border-color: #E2E8F0 !important;
          color: #0F172A !important;
      }
      
      [data-theme='polaris'] aside {
          background-color: rgba(255, 255, 255, 0.9) !important;
          border-right: 1px solid #E2E8F0 !important;
      }

      /* Text Contrast Fixes */
      [data-theme='polaris'] .text-white { color: #0F172A !important; }
      [data-theme='polaris'] .text-white\/20 { color: #CBD5E1 !important; }
      [data-theme='polaris'] .text-gray-300,
      [data-theme='polaris'] .text-gray-400 { color: #475569 !important; } 
      [data-theme='polaris'] .text-gray-500 { color: #64748B !important; } 
      
      /* Badges & Chips */
      [data-theme='polaris'] .bg-white\/5,
      [data-theme='polaris'] .bg-white\/10 { background-color: #F1F5F9 !important; border-color: #E2E8F0 !important; }

      [data-theme='polaris'] .bg-cyber-cyan\/10 { background-color: #ECFEFF !important; color: #0891B2 !important; border-color: #CFFAFE !important; }
      [data-theme='polaris'] .text-cyber-cyan { color: #0891B2 !important; }

      [data-theme='polaris'] .bg-cyber-purple\/10 { background-color: #F5F3FF !important; color: #7C3AED !important; border-color: #DDD6FE !important; }
      [data-theme='polaris'] .text-cyber-purple { color: #7C3AED !important; }

      [data-theme='polaris'] .bg-cyber-yellow\/10 { background-color: #FFFBEB !important; color: #D97706 !important; border-color: #FDE68A !important; }
      [data-theme='polaris'] .text-cyber-yellow { color: #D97706 !important; }

      [data-theme='polaris'] .bg-cyber-green\/10 { background-color: #ECFDF5 !important; color: #059669 !important; border-color: #A7F3D0 !important; }
      [data-theme='polaris'] .text-cyber-green { color: #059669 !important; }

      [data-theme='polaris'] .bg-cyber-red\/10 { background-color: #FEF2F2 !important; color: #DC2626 !important; border-color: #FECACA !important; }
      [data-theme='polaris'] .text-cyber-red { color: #DC2626 !important; }

      /* Modals */
      [data-theme='polaris'] .fixed.inset-0.bg-black\/90 { background-color: rgba(255,255,255,0.95) !important; }
      [data-theme='polaris'] .bg-noise { opacity: 0.05 !important; }

    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.469.0?deps=react@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "pocketbase": "https://esm.sh/pocketbase@^0.26.5"
  }
}
</script>
</head>
  <body>
    <!-- 
      Refined Ambient Orbs:
      - Use radial-gradient instead of CSS blur filter for smoother rendering on 4K/Retina displays.
      - Removed 'blur-[150px]' class which causes banding artifacts.
      - Added grain overlay in CSS (body::after) to dither the gradients.
    -->
    <div 
      class="fixed top-[-10%] left-[10%] w-[800px] h-[800px] rounded-full pointer-events-none animate-pulse-slow" 
      style="background: radial-gradient(circle, var(--glow-primary) 0%, transparent 65%); opacity: 0.6; z-index: -2;"
    ></div>
    
    <div 
      class="fixed bottom-[-10%] right-[0%] w-[700px] h-[700px] rounded-full pointer-events-none animate-float" 
      style="background: radial-gradient(circle, var(--glow-secondary) 0%, transparent 65%); opacity: 0.5; z-index: -2;"
    ></div>
    
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
