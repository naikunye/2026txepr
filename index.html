<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERO.OS - 智能指挥中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cyber: {
                bg: '#000000',
                panel: 'rgba(28, 28, 30, 0.6)',
                border: 'rgba(255, 255, 255, 0.1)',
                text: '#F5F5F7',
                dim: '#86868B',
                // Apple System Colors
                blue: '#0A84FF',
                green: '#30D158',
                indigo: '#5E5CE6',
                orange: '#FF9F0A',
                pink: '#FF375F',
                purple: '#BF5AF2',
                red: '#FF453A',
                teal: '#64D2FF',
                yellow: '#FFD60A',
                cyan: '#0A84FF', // Mapping cyan to Blue for consistency
              }
            },
            fontFamily: {
              sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.3)',
              'glow-blue': '0 0 20px rgba(10, 132, 255, 0.4)',
              'glow-purple': '0 0 20px rgba(191, 90, 242, 0.4)',
            },
            animation: {
              'blob': 'blob 10s infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --panel-bg: rgba(30, 30, 35, 0.4);
        --panel-border: rgba(255, 255, 255, 0.08);
      }

      body {
        background-color: #050505;
        /* Dynamic Mesh Background */
        background-image: 
            radial-gradient(circle at 15% 50%, rgba(94, 92, 230, 0.15), transparent 45%),
            radial-gradient(circle at 85% 30%, rgba(10, 132, 255, 0.15), transparent 45%),
            radial-gradient(circle at 50% 90%, rgba(255, 55, 95, 0.1), transparent 50%);
        background-attachment: fixed;
        color: #F5F5F7;
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden; /* App feels more native */
      }

      /* Glassmorphism Card Utility */
      .tech-border {
        position: relative;
        background: var(--panel-bg);
        backdrop-filter: blur(40px) saturate(180%); /* Heavier Apple Blur */
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid var(--panel-border);
        box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.1);
        border-radius: 24px;
        transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), border-color 0.2s;
      }
      
      .tech-border:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* Input Styles */
      .input-cyber {
        border-radius: 12px !important;
        background: rgba(0,0,0,0.2) !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
        color: white;
      }
      .input-cyber:focus {
        background: rgba(0,0,0,0.4) !important;
        border-color: #0A84FF !important;
        box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.2);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

      /* Animation for smooth fade in */
      .fade-enter { opacity: 0; transform: scale(0.98); }
      .fade-enter-active { opacity: 1; transform: scale(1); transition: opacity 300ms, transform 300ms; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.469.0?deps=react@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <!-- Background Orbs for richness -->
    <div class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] bg-cyber-blue/20 rounded-full blur-[120px] pointer-events-none animate-blob"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-cyber-purple/20 rounded-full blur-[120px] pointer-events-none animate-blob animation-delay-2000"></div>
    
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
