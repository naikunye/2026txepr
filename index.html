<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERO.OS - 智能指挥中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cyber: {
                bg: 'var(--bg-main)', 
                panel: 'var(--bg-panel)', 
                border: 'var(--border-color)', 
                text: 'var(--text-main)', 
                dim: 'var(--text-dim)',
                
                // Dynamic Accents
                blue: 'var(--accent-primary)', 
                cyan: 'var(--accent-secondary)',
                purple: 'var(--accent-tertiary)',
                
                // Functional Colors
                green: 'var(--color-green)',
                orange: 'var(--color-orange)',
                pink: 'var(--color-pink)',
                red: 'var(--color-red)',
                yellow: 'var(--color-yellow)',
              }
            },
            fontFamily: {
              sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            boxShadow: {
              'glass': 'var(--shadow-glass)',
              'glow-blue': '0 0 30px var(--glow-primary)',
              'glow-cyan': '0 0 30px var(--glow-secondary)',
              'neon': '0 0 10px var(--accent-primary), 0 0 20px var(--accent-primary)',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'mesh': 'mesh 20s infinite ease-in-out',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              mesh: {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* --- Dark Mode Defaults (Cosmos) --- */
        --bg-main: #050505;
        --bg-panel: rgba(20, 20, 25, 0.6);
        --border-color: rgba(255, 255, 255, 0.08);
        --text-main: #F5F5F7;
        --text-dim: #86868B;
        
        --accent-primary: #0A84FF;
        --accent-secondary: #40C8E0;
        --accent-tertiary: #5E5CE6;
        
        --color-green: #30D158;
        --color-orange: #FF9F0A;
        --color-pink: #FF375F;
        --color-red: #FF453A;
        --color-yellow: #FFD60A;

        --glow-primary: rgba(10, 132, 255, 0.3);
        --glow-secondary: rgba(64, 200, 224, 0.25);
        --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        
        --gradient-mesh: radial-gradient(at 0% 0%, rgba(10, 132, 255, 0.15) 0px, transparent 50%),
                         radial-gradient(at 100% 100%, rgba(94, 92, 230, 0.15) 0px, transparent 50%);
      }

      /* --- POLARIS THEME (Enterprise Light Mode) --- */
      /* Designed for high legibility, clean lines, and professional palette */
      [data-theme='polaris'] {
        --bg-main: #F8FAFC; /* Slate-50: Very cool light gray */
        --bg-panel: #FFFFFF; /* Pure White */
        --border-color: #E2E8F0; /* Slate-200 */
        --text-main: #0F172A; /* Slate-900 */
        --text-dim: #64748B;  /* Slate-500 */
        
        /* Accents: Saturated but Professional */
        --accent-primary: #2563EB;   /* Blue-600 */
        --accent-secondary: #0891B2; /* Cyan-600 */
        --accent-tertiary: #7C3AED;  /* Violet-600 */
        
        /* Functional Colors: Adjusted for white background (Darker) */
        --color-green: #059669; /* Emerald-600 */
        --color-orange: #D97706; /* Amber-600 */
        --color-pink: #DB2777; /* Pink-600 */
        --color-red: #DC2626; /* Red-600 */
        --color-yellow: #CA8A04; /* Yellow-600 */

        --glow-primary: rgba(37, 99, 235, 0.0); /* Remove glow in light mode */
        --glow-secondary: rgba(8, 145, 178, 0.0);
        
        /* Shadow: Subtle lift, not deep glass */
        --shadow-glass: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.06);
        
        /* Subtle Gradient Background */
        --gradient-mesh: linear-gradient(180deg, #F1F5F9 0%, #F8FAFC 100%);
      }

      body {
        background-color: var(--bg-main);
        background-image: var(--gradient-mesh);
        background-attachment: fixed;
        background-size: cover;
        color: var(--text-main);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        transition: all 0.3s ease;
      }

      /* --- COMPONENT STYLES --- */

      /* 1. Glass Card -> Solid Card in Light Mode */
      .apple-glass {
        background: var(--bg-panel);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-glass);
        border-radius: 20px;
        transition: all 0.2s ease-out;
      }
      
      [data-theme='polaris'] .apple-glass {
        background: #FFFFFF !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border: 1px solid #E2E8F0 !important;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
      }

      [data-theme='polaris'] .apple-glass:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05) !important;
        border-color: #CBD5E1 !important;
      }

      /* 2. Inputs */
      .input-holo {
        background: rgba(0, 0, 0, 0.2) !important;
        border: 1px solid var(--border-color) !important;
        border-radius: 10px !important;
        color: var(--text-main) !important;
        transition: all 0.2s ease;
        font-family: 'JetBrains Mono', monospace;
      }

      [data-theme='polaris'] .input-holo {
        background: #FFFFFF !important;
        border: 1px solid #CBD5E1 !important;
        color: #1E293B !important;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
      }

      .input-holo:focus {
        border-color: var(--accent-primary) !important;
        outline: none;
        box-shadow: 0 0 0 2px var(--glow-primary);
      }
      
      [data-theme='polaris'] .input-holo:focus {
        border-color: var(--accent-primary) !important;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1) !important;
      }

      /* 3. Text & Glows */
      .text-glow { text-shadow: 0 0 10px var(--glow-primary); }
      
      [data-theme='polaris'] .text-glow,
      [data-theme='polaris'] .text-glow-blue,
      [data-theme='polaris'] .text-glow-green, 
      [data-theme='polaris'] .text-glow-red {
          text-shadow: none !important;
      }

      /* --- DEEP OVERRIDES FOR LIGHT MODE --- */
      
      /* A. Layout & Containers */
      [data-theme='polaris'] .bg-black,
      [data-theme='polaris'] .bg-black\/40,
      [data-theme='polaris'] .bg-black\/50,
      [data-theme='polaris'] .bg-black\/60,
      [data-theme='polaris'] .bg-\[\#0c0c0c\],
      [data-theme='polaris'] .bg-\[\#0A0A0A\],
      [data-theme='polaris'] .bg-\[\#0F0F0F\],
      [data-theme='polaris'] .bg-\[\#121212\],
      [data-theme='polaris'] .bg-\[\#1c1c1e\] {
          background-color: #FFFFFF !important;
          border-color: #E2E8F0 !important;
          color: #0F172A !important;
      }
      
      /* Specific override for Sidebar */
      [data-theme='polaris'] aside {
          background-color: #FFFFFF !important;
          border-right: 1px solid #E2E8F0 !important;
          box-shadow: 4px 0 20px rgba(0,0,0,0.02) !important;
      }
      [data-theme='polaris'] aside button.bg-white\/10 {
          background-color: #EFF6FF !important; /* Blue-50 */
          color: #1E40AF !important; /* Blue-800 */
          border: 1px solid #DBEAFE !important;
      }
      [data-theme='polaris'] aside button.text-gray-400 {
          color: #64748B !important; /* Slate-500 */
      }
      [data-theme='polaris'] aside button:hover {
          background-color: #F1F5F9 !important;
          color: #0F172A !important;
      }

      /* B. Text Contrast */
      [data-theme='polaris'] .text-white { color: #0F172A !important; }
      [data-theme='polaris'] .text-white\/20 { color: #CBD5E1 !important; }
      [data-theme='polaris'] .text-gray-300,
      [data-theme='polaris'] .text-gray-400 { color: #475569 !important; } /* Slate-600 */
      [data-theme='polaris'] .text-gray-500 { color: #64748B !important; } /* Slate-500 */
      
      /* C. Badges & Chips (Pastel Style) */
      /* Pattern: bg-COLOR/10 -> bg-COLOR-50, text-COLOR -> text-COLOR-700 */
      
      [data-theme='polaris'] .bg-white\/5,
      [data-theme='polaris'] .bg-white\/10 { background-color: #F1F5F9 !important; border-color: #E2E8F0 !important; }

      /* Green */
      [data-theme='polaris'] .bg-green-500\/10, [data-theme='polaris'] .bg-cyber-green\/10, [data-theme='polaris'] .bg-cyber-green\/20 {
          background-color: #ECFDF5 !important;
          color: #047857 !important;
          border-color: #A7F3D0 !important;
      }
      [data-theme='polaris'] .text-cyber-green, [data-theme='polaris'] .text-green-400, [data-theme='polaris'] .text-green-500 {
          color: #059669 !important;
      }

      /* Blue/Cyan */
      [data-theme='polaris'] .bg-blue-500\/10, [data-theme='polaris'] .bg-cyber-blue\/10, [data-theme='polaris'] .bg-cyber-cyan\/10 {
          background-color: #EFF6FF !important;
          color: #1D4ED8 !important;
          border-color: #BFDBFE !important;
      }
      [data-theme='polaris'] .text-cyber-blue, [data-theme='polaris'] .text-blue-400, [data-theme='polaris'] .text-cyber-cyan {
          color: #2563EB !important;
      }

      /* Red */
      [data-theme='polaris'] .bg-red-500\/5, [data-theme='polaris'] .bg-red-500\/10, [data-theme='polaris'] .bg-red-500\/20, [data-theme='polaris'] .bg-cyber-red\/10 {
          background-color: #FEF2F2 !important; /* Rose-50 */
          color: #B91C1C !important;
          border-color: #FECACA !important;
      }
      [data-theme='polaris'] .text-red-500, [data-theme='polaris'] .text-red-400, [data-theme='polaris'] .text-cyber-red {
          color: #DC2626 !important;
      }
      /* Red Borders */
      [data-theme='polaris'] .border-red-500, [data-theme='polaris'] .border-red-500\/20, [data-theme='polaris'] .border-red-500\/40, [data-theme='polaris'] .border-red-500\/50 {
          border-color: #FECACA !important;
      }

      /* Yellow/Amber */
      [data-theme='polaris'] .bg-yellow-500\/10, [data-theme='polaris'] .bg-cyber-yellow\/10 {
          background-color: #FFFBEB !important;
          color: #B45309 !important;
          border-color: #FDE68A !important;
      }
      [data-theme='polaris'] .text-yellow-500, [data-theme='polaris'] .text-yellow-400, [data-theme='polaris'] .text-cyber-yellow {
          color: #D97706 !important;
      }

      /* Purple */
      [data-theme='polaris'] .bg-purple-500\/10, [data-theme='polaris'] .bg-cyber-purple\/10 {
          background-color: #F5F3FF !important;
          color: #6D28D9 !important;
          border-color: #DDD6FE !important;
      }
      [data-theme='polaris'] .text-purple-400, [data-theme='polaris'] .text-cyber-purple {
          color: #7C3AED !important;
      }

      /* D. Modals & Popovers */
      [data-theme='polaris'] .fixed.inset-0.bg-black\/40 { background-color: rgba(255,255,255,0.5) !important; backdrop-filter: blur(4px) !important; }
      [data-theme='polaris'] .fixed.inset-0.bg-black\/60 { background-color: rgba(100,116,139,0.4) !important; backdrop-filter: blur(4px) !important; }
      
      /* E. Tables */
      [data-theme='polaris'] thead { background-color: #F8FAFC !important; border-bottom: 1px solid #E2E8F0 !important; }
      [data-theme='polaris'] th { color: #475569 !important; }
      [data-theme='polaris'] tr:hover { background-color: #F1F5F9 !important; }
      
      /* F. Scrollbars */
      [data-theme='polaris'] ::-webkit-scrollbar-thumb { background: #CBD5E1; }
      [data-theme='polaris'] ::-webkit-scrollbar-track { background: transparent; }

      /* G. Charts Backgrounds */
      [data-theme='polaris'] .recharts-tooltip-wrapper .bg-black\/90, 
      [data-theme='polaris'] .recharts-tooltip-wrapper .bg-black {
          background-color: #FFFFFF !important;
          border: 1px solid #E2E8F0 !important;
          box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1) !important;
          color: #0F172A !important;
      }
      
      [data-theme='polaris'] .bg-noise { display: none; }

    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.469.0?deps=react@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "pocketbase": "https://esm.sh/pocketbase@^0.26.5"
  }
}
</script>
</head>
  <body>
    <!-- Orbs hidden in Polaris mode via CSS var opacity -->
    <div class="fixed top-[-20%] left-[20%] w-[600px] h-[600px] rounded-full blur-[150px] pointer-events-none animate-pulse-slow" style="background-color: var(--glow-primary); opacity: 0.15"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[500px] h-[500px] rounded-full blur-[150px] pointer-events-none animate-float" style="background-color: var(--glow-secondary); opacity: 0.12"></div>
    
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
