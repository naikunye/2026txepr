<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERO.OS - 未来跨境智能中枢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cyber: {
                bg: '#050505',         // Pure Black
                panel: '#0F1218',      // Dark Tech Blue/Gray
                border: 'rgba(0, 240, 255, 0.2)', // Cyan low opacity
                cyan: '#00F0FF',       // Cyber Cyan
                pink: '#FF003C',       // Cyber Pink
                purple: '#BC13FE',     // Cyber Purple
                yellow: '#FCEE0A',     // Acid Yellow
                green: '#39FF14',      // Neon Green
                text: '#E0E0E0',       // Off-white text
                dim: '#6B7280',        // Dimmed text
              }
            },
            fontFamily: {
              sans: ['"JetBrains Mono"', '"Noto Sans SC"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            boxShadow: {
              'neon-cyan': '0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3)',
              'neon-pink': '0 0 10px rgba(255, 0, 60, 0.5), 0 0 20px rgba(255, 0, 60, 0.3)',
              'tech-panel': 'inset 0 0 20px rgba(0,0,0,0.5), 0 4px 20px rgba(0,0,0,0.8)',
            },
            backgroundImage: {
              'tech-grid': 'linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #020204;
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
          linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px), 
          linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
        color: #E0E0E0;
        font-family: "JetBrains Mono", "Noto Sans SC", sans-serif;
        font-weight: 500;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border: 1px solid #00F0FF;
      }

      .tech-border {
        position: relative;
        background: rgba(15, 18, 24, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 240, 255, 0.2);
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
      }
      
      .tech-border::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 8px; height: 8px;
        border-top: 2px solid #00F0FF;
        border-left: 2px solid #00F0FF;
      }
      .tech-border::after {
        content: '';
        position: absolute;
        bottom: 0; right: 0; width: 8px; height: 8px;
        border-bottom: 2px solid #00F0FF;
        border-right: 2px solid #00F0FF;
      }

      .text-glow {
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
      }
      
      .glitch-effect:hover {
        animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        color: #00F0FF;
      }

      @keyframes glitch {
        0% { transform: translate(0) }
        20% { transform: translate(-2px, 2px) }
        40% { transform: translate(-2px, -2px) }
        60% { transform: translate(2px, 2px) }
        80% { transform: translate(2px, -2px) }
        100% { transform: translate(0) }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.469.0?deps=react@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
