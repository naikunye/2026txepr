<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERO.OS - 未来跨境智能中枢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cyber: {
                bg: 'var(--bg)',
                panel: 'var(--panel)',
                border: 'var(--border)',
                cyan: 'var(--cyan)',
                pink: 'var(--pink)',
                purple: 'var(--purple)',
                yellow: 'var(--yellow)',
                green: 'var(--green)',
                text: 'var(--text)',
                dim: 'var(--dim)',
              }
            },
            fontFamily: {
              sans: ['"JetBrains Mono"', '"Noto Sans SC"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            boxShadow: {
              'neon-cyan': 'var(--shadow-cyan)',
              'neon-pink': 'var(--shadow-pink)',
              'neon-purple': 'var(--shadow-purple)',
              'tech-panel': 'inset 0 0 20px rgba(0,0,0,0.5), 0 4px 20px rgba(0,0,0,0.8)',
            },
            backgroundImage: {
              'tech-grid': 'linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Default Theme: CYBER (Dark/Neon) */
        --bg: #050505;
        --panel: #0F1218;
        --border: rgba(0, 240, 255, 0.2);
        --cyan: #00F0FF;
        --pink: #FF003C;
        --purple: #BC13FE;
        --yellow: #FCEE0A;
        --green: #39FF14;
        --text: #E0E0E0;
        --dim: #6B7280;
        --grid-color: rgba(0, 240, 255, 0.05);
        --shadow-cyan: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3);
        --shadow-pink: 0 0 10px rgba(255, 0, 60, 0.5), 0 0 20px rgba(255, 0, 60, 0.3);
        --shadow-purple: 0 0 10px rgba(188, 19, 254, 0.5), 0 0 20px rgba(188, 19, 254, 0.3);
      }

      /* Theme: CORPORATE (Light/Clean) */
      [data-theme='light'] {
        --bg: #F3F4F6;
        --panel: #FFFFFF;
        --border: #E5E7EB;
        --cyan: #0284C7; /* Sky Blue */
        --pink: #E11D48; /* Rose */
        --purple: #7C3AED; /* Violet */
        --yellow: #D97706; /* Amber */
        --green: #059669; /* Emerald */
        --text: #111827; /* Gray 900 */
        --dim: #6B7280;
        --grid-color: rgba(0, 0, 0, 0.03);
        --shadow-cyan: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        --shadow-pink: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        --shadow-purple: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      /* Theme: OBSIDIAN (Minimal/Matte Black) */
      [data-theme='obsidian'] {
        --bg: #000000;
        --panel: #111111;
        --border: #333333;
        --cyan: #FFFFFF; /* High contrast white */
        --pink: #CCCCCC;
        --purple: #999999;
        --yellow: #FFFFFF;
        --green: #FFFFFF;
        --text: #F3F4F6;
        --dim: #888888;
        --grid-color: rgba(255, 255, 255, 0.03);
        --shadow-cyan: none;
        --shadow-pink: none;
        --shadow-purple: none;
      }

      body {
        background-color: var(--bg);
        background-image: 
          radial-gradient(circle at 50% 0%, var(--border) 0%, transparent 50%),
          linear-gradient(var(--grid-color) 1px, transparent 1px), 
          linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
        color: var(--text);
        font-family: "JetBrains Mono", "Noto Sans SC", sans-serif;
        font-weight: 500;
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--dim); 
        border: 1px solid var(--border);
      }

      .tech-border {
        position: relative;
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        box-shadow: inset 0 0 20px rgba(0,0,0,0.05); /* Lighter inset for compatibility */
      }
      
      .tech-border::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 8px; height: 8px;
        border-top: 2px solid var(--cyan);
        border-left: 2px solid var(--cyan);
      }
      .tech-border::after {
        content: '';
        position: absolute;
        bottom: 0; right: 0; width: 8px; height: 8px;
        border-bottom: 2px solid var(--cyan);
        border-right: 2px solid var(--cyan);
      }

      .text-glow {
        text-shadow: 0 0 10px var(--border);
      }
      
      .glitch-effect:hover {
        animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        color: var(--cyan);
      }

      @keyframes glitch {
        0% { transform: translate(0) }
        20% { transform: translate(-2px, 2px) }
        40% { transform: translate(-2px, -2px) }
        60% { transform: translate(2px, 2px) }
        80% { transform: translate(2px, -2px) }
        100% { transform: translate(0) }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.469.0?deps=react@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
