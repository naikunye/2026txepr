<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERO.OS - 智能指挥中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cyber: {
                bg: '#000000',
                panel: 'rgba(20, 20, 22, 0.65)',
                border: 'rgba(255, 255, 255, 0.08)',
                text: '#F5F5F7',
                dim: '#86868B',
                // Apple System Colors (Vibrant)
                blue: '#0A84FF',
                green: '#30D158',
                indigo: '#5E5CE6',
                orange: '#FF9F0A',
                pink: '#FF375F',
                purple: '#BF5AF2',
                red: '#FF453A',
                teal: '#64D2FF',
                yellow: '#FFD60A',
                cyan: '#40C8E0', 
              }
            },
            fontFamily: {
              sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.5)',
              'glow-blue': '0 0 30px rgba(10, 132, 255, 0.3)',
              'glow-cyan': '0 0 30px rgba(64, 200, 224, 0.25)',
              'glow-purple': '0 0 30px rgba(191, 90, 242, 0.25)',
              'hologram': 'inset 0 0 20px rgba(255,255,255,0.05)',
            },
            animation: {
              'blob': 'blob 20s infinite alternate',
              'mesh': 'mesh 20s infinite ease-in-out',
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(50px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-30px, 40px) scale(0.95)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              mesh: {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --panel-bg: rgba(28, 28, 30, 0.4);
        --panel-border: rgba(255, 255, 255, 0.1);
        --glass-blur: blur(40px);
      }

      body {
        background-color: #000000;
        /* Aurora Mesh Gradient */
        background: 
            radial-gradient(at 0% 0%, rgba(10, 132, 255, 0.15) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(191, 90, 242, 0.15) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(48, 209, 88, 0.1) 0px, transparent 50%),
            radial-gradient(at 0% 100%, rgba(100, 210, 255, 0.1) 0px, transparent 50%),
            #000000;
        background-attachment: fixed;
        background-size: 200% 200%;
        animation: mesh 25s ease infinite;
        
        color: #F5F5F7;
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      /* Advanced Glassmorphism */
      .apple-glass {
        background: rgba(30, 30, 32, 0.6);
        backdrop-filter: saturate(180%) blur(30px);
        -webkit-backdrop-filter: saturate(180%) blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 
            0 4px 6px -1px rgba(0, 0, 0, 0.1), 
            0 2px 4px -1px rgba(0, 0, 0, 0.06),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }
      
      .apple-glass:hover {
        background: rgba(40, 40, 45, 0.7);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 
            0 20px 40px -10px rgba(0,0,0,0.5),
            0 0 15px rgba(255,255,255,0.05);
        transform: translateY(-2px);
      }

      /* Holographic Card Logic */
      .holo-card {
        position: relative;
        overflow: hidden;
      }
      .holo-card::before {
        content: '';
        position: absolute;
        top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
        transition: 0.5s;
        pointer-events: none;
      }
      .holo-card:hover::before {
        left: 100%;
      }

      /* Refined Inputs */
      .input-holo {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 12px !important;
        color: white !important;
        transition: all 0.3s ease;
        font-family: 'JetBrains Mono', monospace;
      }
      .input-holo:focus {
        background: rgba(255, 255, 255, 0.08) !important;
        border-color: #0A84FF !important;
        box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15), 0 0 20px rgba(10, 132, 255, 0.2);
        outline: none;
      }

      /* Select Options Fix for Dark Mode */
      select option {
        background-color: #1c1c1e;
        color: #F5F5F7;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

      /* Utilities */
      .text-glow { text-shadow: 0 0 10px rgba(255,255,255,0.3); }
      .text-glow-blue { text-shadow: 0 0 15px rgba(10, 132, 255, 0.6); }
      .text-glow-purple { text-shadow: 0 0 15px rgba(191, 90, 242, 0.6); }
      
      .bg-noise {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.469.0?deps=react@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "pocketbase": "https://esm.sh/pocketbase@^0.26.5"
  }
}
</script>
</head>
  <body>
    <!-- Vivid ambient orbs -->
    <div class="fixed top-[-20%] left-[20%] w-[600px] h-[600px] bg-cyber-blue/10 rounded-full blur-[150px] pointer-events-none animate-pulse-slow"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[500px] h-[500px] bg-cyber-purple/10 rounded-full blur-[150px] pointer-events-none animate-float"></div>
    
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
