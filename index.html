<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERO.OS - 未来跨境智能中枢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cyber: {
                bg: 'var(--bg)',
                panel: 'var(--panel)',
                border: 'var(--border)',
                cyan: 'var(--cyan)',
                pink: 'var(--pink)',
                purple: 'var(--purple)',
                yellow: 'var(--yellow)',
                green: 'var(--green)',
                text: 'var(--text)',
                dim: 'var(--dim)',
              }
            },
            fontFamily: {
              // FORCE Monospace as the default 'sans' stack to achieve the "All fonts equal-width" look
              sans: ['"JetBrains Mono"', '"Noto Sans SC"', 'monospace'],
              mono: ['"JetBrains Mono"', '"Noto Sans SC"', 'monospace'],
            },
            boxShadow: {
              'neon-cyan': 'var(--shadow-cyan)',
              'neon-pink': 'var(--shadow-pink)',
              'neon-purple': 'var(--shadow-purple)',
              'tech-panel': 'var(--panel-shadow)',
            },
            backgroundImage: {
              'tech-grid': 'linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Default Theme: NIGHT CITY (Classic Cyberpunk) */
        --bg: #050505;
        --panel: #0F1218;
        --border: rgba(0, 240, 255, 0.3);
        --cyan: #00F0FF;
        --pink: #FF003C;
        --purple: #BC13FE;
        --yellow: #FCEE0A;
        --green: #39FF14;
        --text: #E0E0E0;
        --dim: #6B7280;
        --grid-color: rgba(0, 240, 255, 0.05);
        --shadow-cyan: 0 0 15px rgba(0, 240, 255, 0.5);
        --shadow-pink: 0 0 15px rgba(255, 0, 60, 0.5);
        --shadow-purple: 0 0 15px rgba(188, 19, 254, 0.5);
        --panel-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 4px 20px rgba(0,0,0,0.8);
      }

      /* Theme: ARASAKA (Tactical Red/Dark) */
      [data-theme='obsidian'] {
        --bg: #000000; /* Pure Void */
        --panel: #050505; /* Near Black */
        --border: #FF0000; /* Sharp Red Border */
        --cyan: #FF0000; /* REPLACED Cyan with Red for Monochromatic feel */
        --pink: #FFFFFF; /* White Accents */
        --purple: #B91C1C; /* Dark Red */
        --yellow: #FFD700; /* Gold */
        --green: #00FF00; /* Retro Terminal Green */
        --text: #D4D4D4; /* Light Grey */
        --dim: #525252; /* Dark Grey */
        --grid-color: rgba(255, 0, 0, 0.15); /* Red Grid */
        
        --shadow-cyan: 0 0 15px rgba(255, 0, 0, 0.6); /* Red Glow */
        --shadow-pink: 0 0 10px rgba(255, 255, 255, 0.3);
        --shadow-purple: 0 0 10px rgba(185, 28, 28, 0.4);
        --panel-shadow: inset 0 0 40px rgba(20, 0, 0, 0.8), 0 0 0 1px #330000;
      }

      /* Theme: TIKTOK (Creator Stream) */
      [data-theme='tiktok'] {
        --bg: #000000;
        --panel: #121212;
        --border: rgba(255, 255, 255, 0.15);
        --cyan: #25F4EE; /* TikTok Cyan */
        --pink: #FE2C55; /* TikTok Red */
        --purple: #25F4EE; /* Re-map purple to cyan for consistency */
        --yellow: #FCEE0A;
        --green: #00E676;
        --text: #FFFFFF;
        --dim: #888888;
        --grid-color: rgba(37, 244, 238, 0.05);
        
        --shadow-cyan: 0 0 15px rgba(37, 244, 238, 0.4);
        --shadow-pink: 0 0 15px rgba(254, 44, 85, 0.4);
        --shadow-purple: 0 0 15px rgba(37, 244, 238, 0.2);
        --panel-shadow: 0 4px 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
      }

      body {
        background-color: var(--bg);
        background-image: 
          linear-gradient(var(--grid-color) 1px, transparent 1px), 
          linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text);
        /* Enforce monospace font family globally */
        font-family: "JetBrains Mono", "Noto Sans SC", monospace;
        font-weight: 500;
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border); 
        border-radius: 0;
      }

      .tech-border {
        position: relative;
        background: var(--panel);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        box-shadow: var(--panel-shadow);
        transition: all 0.3s ease;
      }
      
      /* Corner accents - Crucial for Sci-Fi feel in all themes */
      .tech-border::before {
        content: '';
        position: absolute;
        top: -1px; left: -1px; width: 10px; height: 10px;
        border-top: 2px solid var(--cyan);
        border-left: 2px solid var(--cyan);
        transition: border-color 0.3s;
        z-index: 10;
      }
      .tech-border::after {
        content: '';
        position: absolute;
        bottom: -1px; right: -1px; width: 10px; height: 10px;
        border-bottom: 2px solid var(--cyan);
        border-right: 2px solid var(--cyan);
        transition: border-color 0.3s;
        z-index: 10;
      }

      .text-glow {
        text-shadow: 0 0 10px var(--border);
      }
      
      /* Special overrides for Arasaka (Red) Theme */
      [data-theme='obsidian'] .text-cyber-cyan { color: #FF0000 !important; }
      [data-theme='obsidian'] .border-cyber-cyan { border-color: #FF0000 !important; }
      [data-theme='obsidian'] .bg-cyber-cyan { background-color: #FF0000 !important; color: black !important; }
      [data-theme='obsidian'] .shadow-neon-cyan { box-shadow: 0 0 15px #FF0000 !important; }
      
      .clip-path-hexagon {
        clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.469.0?deps=react@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
