<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERO.OS - 未来跨境智能中枢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cyber: {
                bg: 'var(--bg)',
                panel: 'var(--panel)',
                border: 'var(--border)',
                cyan: 'var(--cyan)',
                pink: 'var(--pink)',
                purple: 'var(--purple)',
                yellow: 'var(--yellow)',
                green: 'var(--green)',
                text: 'var(--text)',
                dim: 'var(--dim)',
              }
            },
            fontFamily: {
              sans: ['"JetBrains Mono"', '"Noto Sans SC"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            boxShadow: {
              'neon-cyan': 'var(--shadow-cyan)',
              'neon-pink': 'var(--shadow-pink)',
              'neon-purple': 'var(--shadow-purple)',
              'tech-panel': 'var(--panel-shadow)',
            },
            backgroundImage: {
              'tech-grid': 'linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Default Theme: CYBER (Dark/Neon) */
        --bg: #050505;
        --panel: #0F1218;
        --border: rgba(0, 240, 255, 0.2);
        --cyan: #00F0FF;
        --pink: #FF003C;
        --purple: #BC13FE;
        --yellow: #FCEE0A;
        --green: #39FF14;
        --text: #E0E0E0;
        --dim: #6B7280;
        --grid-color: rgba(0, 240, 255, 0.05);
        --shadow-cyan: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3);
        --shadow-pink: 0 0 10px rgba(255, 0, 60, 0.5), 0 0 20px rgba(255, 0, 60, 0.3);
        --shadow-purple: 0 0 10px rgba(188, 19, 254, 0.5), 0 0 20px rgba(188, 19, 254, 0.3);
        --panel-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 4px 20px rgba(0,0,0,0.8);
      }

      /* Theme: CORPORATE (Professional/Clean/Swiss) */
      [data-theme='light'] {
        --bg: #F1F5F9; /* Slate 100 */
        --panel: #FFFFFF;
        --border: #E2E8F0; /* Slate 200 */
        --cyan: #2563EB; /* Royal Blue 600 - Professional, trustworthy */
        --pink: #BE123C; /* Rose 700 */
        --purple: #7E22CE; /* Purple 700 */
        --yellow: #B45309; /* Amber 700 */
        --green: #15803D; /* Green 700 */
        --text: #1E293B; /* Slate 800 - High legibility */
        --dim: #64748B; /* Slate 500 */
        --grid-color: rgba(0, 0, 0, 0.03);
        /* Soft, diffuse shadows for depth without neon */
        --shadow-cyan: 0 4px 12px rgba(37, 99, 235, 0.15); 
        --shadow-pink: 0 4px 12px rgba(190, 18, 60, 0.15);
        --shadow-purple: 0 4px 12px rgba(126, 34, 206, 0.15);
        --panel-shadow: 0 1px 3px rgba(0,0,0,0.05), 0 10px 15px -3px rgba(0,0,0,0.05);
      }

      /* Theme: OBSIDIAN (Matte/Stealth/Luxury) */
      [data-theme='obsidian'] {
        --bg: #000000; /* Pure Black */
        --panel: #111111; /* Graphite */
        --border: #333333; /* Dark Gray */
        --cyan: #E4E4E7; /* Zinc 200 - Silver/White Accent */
        --pink: #A1A1AA; /* Zinc 400 - Desaturated */
        --purple: #71717A; /* Zinc 500 */
        --yellow: #D4D4D8; /* Zinc 300 */
        --green: #FFFFFF; /* White */
        --text: #D4D4D8; /* Zinc 300 */
        --dim: #52525B; /* Zinc 600 */
        --grid-color: rgba(255, 255, 255, 0.04);
        /* No glow, just flat matte elegance */
        --shadow-cyan: none;
        --shadow-pink: none;
        --shadow-purple: none;
        --panel-shadow: 0 0 0 1px #333; /* Simulated thin border */
      }

      body {
        background-color: var(--bg);
        background-image: 
          linear-gradient(var(--grid-color) 1px, transparent 1px), 
          linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text);
        font-family: "JetBrains Mono", "Noto Sans SC", sans-serif;
        font-weight: 500;
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      /* Global Override for Hardcoded Colors in Light Mode */
      /* This is a safety net for components that still have 'text-white' hardcoded */
      [data-theme='light'] .text-white {
        color: #1E293B !important;
      }
      [data-theme='light'] .bg-black {
        background-color: #ffffff !important;
        border-color: #E2E8F0 !important;
      }
      [data-theme='light'] .bg-black\/40, 
      [data-theme='light'] .bg-black\/50,
      [data-theme='light'] .bg-black\/80 {
        background-color: rgba(255, 255, 255, 0.9) !important;
        backdrop-filter: blur(10px);
      }
      [data-theme='light'] .border-white\/10,
      [data-theme='light'] .border-white\/20 {
        border-color: #E2E8F0 !important;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border); 
        border-radius: 3px;
      }

      .tech-border {
        position: relative;
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        box-shadow: var(--panel-shadow);
        transition: all 0.3s ease;
      }
      
      /* Corner accents - hide in Light mode for cleaner look, subtle in Obsidian */
      [data-theme='light'] .tech-border::before,
      [data-theme='light'] .tech-border::after {
        display: none;
      }
      
      [data-theme='cyber'] .tech-border::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 8px; height: 8px;
        border-top: 2px solid var(--cyan);
        border-left: 2px solid var(--cyan);
      }
      [data-theme='cyber'] .tech-border::after {
        content: '';
        position: absolute;
        bottom: 0; right: 0; width: 8px; height: 8px;
        border-bottom: 2px solid var(--cyan);
        border-right: 2px solid var(--cyan);
      }

      .text-glow {
        text-shadow: 0 0 10px var(--border);
      }
      [data-theme='light'] .text-glow,
      [data-theme='obsidian'] .text-glow {
        text-shadow: none;
      }
      
      .clip-path-hexagon {
        clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.469.0?deps=react@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
